<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Préparateur de devis</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:15px;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0 0 10px}.client{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{padding:11px;border-radius:9px;border:1px solid #d1d5db;flex:1;min-width:160px}
.tabs{display:flex;gap:6px;overflow:auto;padding:9px;background:#fff;position:sticky;top:82px;z-index:4}
.tab{border:0;padding:11px 14px;border-radius:9px;background:#e5e7eb;font-weight:bold}.tab.active{background:#111827;color:#fff}
main{max-width:900px;margin:auto;padding:10px 10px 100px}.summary{background:#fff;border-radius:12px;padding:13px;margin-bottom:12px}
.item{background:#fff;border-radius:12px;margin:7px 0;padding:11px;box-shadow:0 1px 3px #0001}
.row{display:grid;grid-template-columns:28px 1fr 90px;gap:8px}.desc{font-size:14px;line-height:1.3}
.meta{color:#6b7280;font-size:12px;margin-top:4px}.price{text-align:right;font-weight:bold;font-size:14px}
.qty{width:75px;padding:7px;border:1px solid #d1d5db;border-radius:7px;margin-top:7px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:9px;z-index:6}
.totalbar{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.total{font-size:20px;font-weight:bold}.action{border:0;border-radius:9px;padding:11px 13px;font-weight:bold;background:#111827;color:#fff}.clear{background:#dc2626}
@media(max-width:520px){.row{grid-template-columns:27px 1fr 78px}.desc{font-size:13px}}

.pdf-summary{display:none}
.pdf-title{font-size:24px;font-weight:700;margin-bottom:4px}
.pdf-meta{font-size:13px;color:#4b5563;margin-bottom:18px}
.pdf-parties{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;margin:0 0 18px;padding:9px 12px;border:1px solid #dbeafe;border-radius:7px;background:#eff6ff}
.pdf-party{display:flex;gap:5px;align-items:baseline}
.pdf-party-label{font-weight:700;color:#374151}
.pdf-party-value{font-weight:700;color:#2563eb}
.pdf-party-value.client-value{color:#1d4ed8}

.pdf-table{width:100%;border-collapse:collapse;font-size:12px}
.pdf-table th,.pdf-table td{border:1px solid #d1d5db;padding:7px;text-align:left}
.pdf-table th{background:#f3f4f6}
.pdf-table td.num,.pdf-table th.num{text-align:right}
.pdf-total{text-align:right;font-size:18px;font-weight:700;margin-top:15px}
@media print{
  .pdf-summary{display:block!important}
  #list,.summary{display:none!important}
  .pdf-summary{padding:10px 0}
}
@media print{header,.tabs,.bottom,.no-print{display:none!important}body{background:#fff}main{padding:0}.item{box-shadow:none;border-bottom:1px solid #ddd;border-radius:0}}
.badge{display:inline-block;margin-top:5px;padding:4px 7px;border-radius:6px;background:#eef2ff;font-size:11px;font-weight:700}
.search-wrap{margin:10px 0}
.search-wrap input{width:100%;padding:13px 14px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;background:#fff}
.search-wrap input:focus{outline:2px solid #111827}
.hidden-search{display:none!important}
</style></head>
<body>
<header><h1>Préparateur de devis</h1>
<div class="client"><input id="client" type="text" placeholder="Client / chantier">
<input id="date" type="text" placeholder="Date"></div></header>

<button class="tab active" onclick="showTab('BUMP',this)">BUMP</button>

<button class="tab" onclick="showTab('TIME2PLUG',this)">TIME2PLUG</button>
</div>

function money(x){return x.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";}

function render(){
 const list=document.getElementById("list"); list.innerHTML="";
 DATA[current].forEach((it,i)=>{
  const s=STATE[current][i], div=document.createElement("div"); div.className="item";
  div.innerHTML='<div class="row">'+
  '<input type="checkbox" '+(s.checked?"checked":"")+' onchange="toggleItem('+i+',this.checked)">'+

 }); updateTotal();
}

function applySearch(){
  const q=(document.getElementById("searchBox").value||"").trim().toLowerCase();
  document.querySelectorAll("#list .item").forEach((el)=>{

  });
}

function toggleItem(i,v){STATE[current][i].checked=v;render();}
function setQty(i,v){STATE[current][i].qty=parseFloat(v)||0;updateTotal();}
function updateTotal(){
 let total=0,count=0;
 Object.keys(DATA).forEach(k=>DATA[k].forEach((it,i)=>{if(STATE[k][i].checked){total+=it.price*STATE[k][i].qty;count++;}}));
 document.getElementById("total").textContent=money(total);

}

function generatePDF(){

  let rows="", total=0, count=0;

  Object.keys(DATA).forEach(k=>{

      const st=STATE[k][i];
      if(st.checked && st.qty>0){
        const line=it.price*st.qty;
        total+=line; count++;

          '<td><b>'+esc(it.code)+'</b></td>'+
          '<td>'+esc(it.desc)+'</td>'+
          '<td>'+esc(it.unit)+'</td>'+
          '<td class="num">'+st.qty+'</td>'+
          '<td class="num">'+money(it.price)+'</td>'+
          '<td class="num">'+money(line)+'</td>'+
        '</tr>';
      }
    });
  });

    '</tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="pdf-total">TOTAL HT : '+money(total)+'</div>';

  window.print();
}
