name: Prepare multi-photo test

on:
  push:
    branches: [feature/multi-photo-selection]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject multi-photo script
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          tag='<script src="./multi-photo.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s: raise SystemExit("No body")
              s=s.replace(marker,tag+'\n'+marker,1)
              p.write_text(s,encoding="utf-8")
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable multiple photo selection"
          git push